---
layout: default
---
<div class="doc">
  <div class="post-list">
    {%- for post in site.posts %}
    <a class="card card--interactive post-card" href="{{ post.url | relative_url }}">
      <h2 class="post-card__title" data-toc-skip>{{ post.title }}</h2>
      <p class="post-card__excerpt">{{ post.excerpt | strip_html | normalize_whitespace | truncate: 180 }}</p>
      <div class="post-card__meta">
        <span class="chip">{{ post.date | date: "%-d %b %Y" }}</span>
        {%- for tag in post.tags limit: 3 %}
        <span class="chip">{{ tag }}</span>
        {%- endfor %}
      </div>
    </a>
    {%- endfor %}
  </div>
</div>
